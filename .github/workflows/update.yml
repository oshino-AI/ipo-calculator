name: 공모주 데이터 갱신 및 배포

on:
  schedule:
    # 시각은 UTC 기준. 한국 시각 평일 09:15, 12:30, 16:10, 20:00
    - cron: "15 0 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "0 11 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:

# 기본은 읽기만. 쓰기 권한은 꼭 필요한 작업에만 따로 준다.
# 외부 패키지(pip, npm)를 설치하는 작업에는 쓰기 권한을 주지 않아서,
# 패키지가 오염돼도 저장소나 배포된 사이트를 바꿀 수 없게 한다.
# 액션은 이름표 대신 커밋 SHA로 고정한다(뒤의 주석이 버전).
permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.collect.outcome == 'success' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: 수집기 테스트
        run: |
          pip install -r collector/requirements.txt
          cd collector && python -m unittest test_collect

      - name: 공모주 데이터 수집
        id: collect
        continue-on-error: true # 실패해도 마지막 정상 데이터로 배포를 이어 간다.
        run: python collector/collect.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.collect.outcome == 'success'
        with:
          name: ipos
          path: web/public/data/ipos.json
          retention-days: 1

  save:
    # 외부 코드를 실행하지 않고, 수집 결과 파일만 커밋한다.
    needs: collect
    if: needs.collect.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ipos
          path: web/public/data

      - name: 데이터 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data/ipos.json
          git diff --cached --quiet || git commit -m "공모주 데이터 갱신"
          git push

  build:
    needs: [collect, save]
    if: ${{ !cancelled() && needs.collect.result == 'success' && needs.save.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.collect.outputs.ok == 'true'
        with:
          name: ipos
          path: web/public/data

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: 앱 테스트와 빌드
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist

  deploy:
    needs: [collect, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: 수집 실패 알림
        if: needs.collect.outputs.ok != 'true'
        run: |
          echo "::error::공모주 데이터 수집에 실패해 이전 데이터로 배포했습니다."
          exit 1
